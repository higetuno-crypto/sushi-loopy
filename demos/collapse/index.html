<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e13">
  <link rel="icon" href="data:,">
  <title>SUSHI LOOPY — The last piece</title>
  <style>
    :root { color-scheme:dark; font-family:Arial,"Yu Gothic",sans-serif; color:#eee9db; background:#080e13; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { width:min(1440px,100%); margin:auto; padding:26px 32px 24px; }
    header { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:20px; }
    h1 { font-size:14px; font-weight:500; letter-spacing:.24em; margin:0; }
    header span { font-size:10px; letter-spacing:.18em; color:#b0b8b5; }
    #stage { position:relative; width:100%; aspect-ratio:16/9; background:#080e13; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; }
    #start { position:absolute; inset:0; display:grid; place-content:center; text-align:center; background:#080e1344; }
    #start[hidden] { display:none; }
    #start button { padding:18px 30px; border:1px solid #eee9db77; border-radius:0; background:#0c171bef; color:#eee9db; font:inherit; font-size:13px; letter-spacing:.15em; cursor:pointer; }
    #start p { color:#d2d5c8; font-size:11px; letter-spacing:.1em; }
    #controls { display:flex; align-items:center; gap:16px; margin-top:18px; flex-wrap:wrap; }
    #controls button { background:none; border:1px solid #66706d; color:inherit; min-height:42px; padding:9px 15px; font:inherit; font-size:12px; cursor:pointer; }
    button:disabled { opacity:.45; cursor:wait!important; }
    button:focus-visible, input:focus-visible { outline:2px solid #f4bf78; outline-offset:5px; }
    #seek { flex:1; min-width:100px; accent-color:#dbaf73; height:28px; }
    #time { font:11px monospace; color:#bdc5be; min-width:86px; }
    footer { display:flex; justify-content:space-between; gap:20px; color:#b0b8b5; margin-top:22px; font-size:11px; line-height:1.8; }
    footer p { margin:0; }
    #status { min-height:20px; }
    #stage:fullscreen { width:100vw; height:100vh; aspect-ratio:auto; display:grid; place-items:center; }
    #stage:fullscreen canvas { width:100%; height:100%; object-fit:contain; }
    @media(max-width:600px) { main { padding:20px 14px; } header span { display:none; } #controls { gap:8px; } #controls button { padding:9px 11px; } #seek { order:5; flex-basis:100%; } footer { display:block; } }
    @media(prefers-reduced-motion:reduce) { #start p::after { content:' ／ 手動再生'; } }
  </style>
</head>
<body>
<main>
  <header><h1>SUSHI LOOPY</h1><span>THE LAST PIECE — ERROR STORM / 03</span></header>
  <div id="stage">
    <canvas id="film" width="1920" height="1080" role="img" aria-label="エラーダイアログが増殖し、架空のブラウザ停止と一瞬のブルースクリーン、無音の停止を経て寿司の街が崩れる42秒の映像"></canvas>
    <div id="start"><div><button id="begin" disabled>映像を準備しています</button><p>42秒・音とともに</p></div></div>
  </div>
  <div id="controls" aria-label="再生操作">
    <button id="play" disabled aria-label="映像を再生">再生</button>
    <button id="restart" disabled>最初から</button>
    <input id="seek" type="range" min="0" max="42" step="0.01" value="0" aria-label="再生位置（秒）" disabled>
    <output id="time">00:00 / 00:42</output>
    <button id="sound" aria-pressed="true">音 ON</button>
    <button id="fullscreen">全画面</button>
  </div>
  <footer><p>積み重ねた世界が、最後の一貫に還る。</p><p id="status" role="status" aria-live="polite">街のモデルと音を読み込み中</p></footer>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
